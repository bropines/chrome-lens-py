# flake8 does not read pyproject.toml, so its configuration lives here. Project
# metadata and the other tools' settings are in pyproject.toml.
[flake8]
max-line-length = 140
extend-ignore =
    E203,
    W503,
    # TODO: drop once the unused imports are gone (7 left in src/ on this
    # branch: api.py, cli/main.py, core/image_processor.py,
    # core/request_handler.py, utils/config_manager.py). `flake8 src` is clean
    # without this line when they are.
    F401
exclude =
    .git,
    __pycache__,
    build,
    dist,
    venv,
    .venv,
    lens_betterproto.py,
    src/chrome_lens_py/utils/protobufs/*.py
