# Project metadata now lives in pyproject.toml. Only tool config that has no
# pyproject equivalent remains here: flake8 still does not read pyproject.
[flake8]
max-line-length = 140
extend-ignore =
    E203,
    W503,
    F401
exclude =
    .git,
    __pycache__,
    build,
    dist,
    venv,
    .venv,
    lens_betterproto.py,
    src/chrome_lens_py/utils/protobufs/*.py
