[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome_lens_py"
dynamic = ["version"]
description = "Python library for Google Lens OCR and Translation using the crupload endpoint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT License" }
authors = [{ name = "Bropines", email = "bropines@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "httpx[socks,http2] >= 0.20",
    "Pillow >= 10.1",
    # The checked-in *_pb2.py files are generated by protoc 33.5, whose gencode
    # refuses to load on an older runtime. Keep this in step with them; a test
    # (tests/test_protos.py) fails if it falls behind. Gencode 6.x also loads on
    # runtime 7.x (with a warning at most).
    "protobuf >= 6.33.5, < 8",
    "filetype >= 1.0",
    "rich >= 10.0",
]

[project.urls]
Homepage = "https://github.com/bropines/chrome-lens-py"

[project.scripts]
lens_scan = "chrome_lens_py.client:entry"

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
# Pillow wheels ship without libraqm, so right-to-left scripts need shaping and
# bidi done in Python before the text reaches the renderer.
rtl = ["python-bidi>=0.4", "arabic-reshaper>=3.0"]
# Per-character font fallback needs to read font cmaps.
fonts = ["fonttools>=4.0"]
numpy = ["numpy"]
dev = ["black", "isort", "flake8", "mypy", "pytest", "pytest-asyncio"]

[tool.setuptools.dynamic]
version = { attr = "chrome_lens_py.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
# So the suite runs straight from a checkout, with no install step. The
# package lives under src/, which is otherwise only importable once
# something has been pip-installed.
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["network: test requires live access to the Lens API"]
