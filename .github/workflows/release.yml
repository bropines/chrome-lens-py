name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install protobuf

      - name: Lint with flake8
        run: flake8 src

      - name: Check formatting with black
        run: black --check src

      - name: Sort imports check (isort)
        run: isort --check-only src

      - name: Run tests
        run: pytest tests/test_api.py

  build:
    name: Build for ${{ matrix.os }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    # Only build on main branch or tags, or manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: lens_scan.exe
            asset_name: lens_scan-windows-amd64.exe
          - os: ubuntu-latest
            artifact_name: lens_scan.bin
            asset_name: lens_scan-linux-amd64
          - os: macos-latest
            artifact_name: lens_scan.bin
            asset_name: lens_scan-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install nuitka zstandard

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-nuitka
          max-size: "500M"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cc65 # Nuitka might need a compiler

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --assume-yes-for-downloads --standalone --onefile --output-dir=dist --output-filename=lens_scan src/chrome_lens_py/cli/main.py

      - name: Build with Nuitka (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m nuitka --assume-yes-for-downloads --standalone --onefile --output-dir=dist --output-filename=lens_scan.bin src/chrome_lens_py/cli/main.py

      - name: Rename artifacts
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as GitHub Artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish-pypi:
    name: Build and Publish Python Package
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/chrome_lens_py
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install build

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.12
