name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install protobuf

      - name: Lint with flake8
        run: flake8 src

      - name: Check formatting with black
        run: black --check src

      - name: Sort imports check (isort)
        run: isort --check-only src

      # The offline suite is the gate. The live-API tests are informative only:
      # they depend on Google answering a runner, which is not this repo's bug.
      - name: Run tests
        run: pytest -m "not network"

      - name: Run live API tests
        continue-on-error: true
        run: pytest -m network

  build:
    name: Build for ${{ matrix.os }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Only build on main branch or tags, or manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: lens_scan-windows-amd64
            binary: lens_scan.exe
          - os: ubuntu-latest
            asset_name: lens_scan-linux-amd64
            binary: lens_scan.bin
          - os: macos-latest
            asset_name: lens_scan-macos-arm64
            binary: lens_scan.bin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Two deliberate choices here.
      #
      # lens_scan.py, not src/chrome_lens_py/cli/main.py: building a module file
      # directly leaves its relative imports without a package to resolve
      # against, and every binary died on startup with "attempted relative
      # import with no known parent package".
      #
      # standalone, not onefile: onefile unpacks an executable payload into
      # %TEMP% and runs it on every launch. That is what antivirus heuristics
      # flag (Defender reports Trojan:Win32/Wacatac.H!ml, an ML verdict rather
      # than a signature), and it also cost 1.67 s of startup against 0.52 s
      # from source. A folder does neither.
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@v1.1
        with:
          script-name: lens_scan.py
          standalone: true
          onefile: false
          output-dir: dist
          include-package: chrome_lens_py
          assume-yes-for-downloads: true

      - name: Smoke-test the binary
        shell: bash
        run: |
          chmod +x dist/lens_scan.dist/${{ matrix.binary }} || true
          ./dist/lens_scan.dist/${{ matrix.binary }} --help > /dev/null
          echo "binary starts and prints help"

      - name: Package the folder
        shell: bash
        run: |
          mv dist/lens_scan.dist dist/${{ matrix.asset_name }}
          cd dist && 7z a -tzip ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }} > /dev/null
          ls -la ${{ matrix.asset_name }}.zip

      # Published next to the zip so the installers can tell a good download
      # from a truncated or tampered one. sha256sum's own format, so
      # `sha256sum -c lens_scan-linux-amd64.zip.sha256` verifies it by hand.
      - name: Checksum the archive
        shell: bash
        working-directory: dist
        run: |
          if command -v sha256sum > /dev/null; then
            sha256sum ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.zip.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.zip.sha256
          fi
          cat ${{ matrix.asset_name }}.zip.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2.3.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ matrix.asset_name }}.zip
            dist/${{ matrix.asset_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as GitHub Artifact (for manual runs)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}.zip
            dist/${{ matrix.asset_name }}.zip.sha256


  # Keeps bropines/homebrew-tap pointing at the release that was just built.
  # Runs only after every platform has uploaded, so the formula never names an
  # asset that failed to build.
  #
  # Needs a token that can write to the other repository, since GITHUB_TOKEN is
  # scoped to this one: create a fine-grained PAT with contents:write on
  # bropines/homebrew-tap and store it as the TAP_TOKEN secret. Without it this
  # job warns and stops rather than failing the release.
  bump-homebrew-tap:
    name: Bump the Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check for the token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_TOKEN is not set; leaving the Homebrew formula alone."
          fi

      - name: Check out this repository (for the bump script)
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4.2.2
        with:
          path: source

      - name: Check out the tap
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4.2.2
        with:
          repository: bropines/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Bump the formula
        if: steps.gate.outputs.ok == 'true'
        run: |
          python3 source/scripts/bump_tap_formula.py             "${{ github.ref_name }}" tap/Formula/lens-scan.rb
          grep -E 'version |url |sha256 ' tap/Formula/lens-scan.rb

      - name: Commit and push
        if: steps.gate.outputs.ok == 'true'
        working-directory: tap
        run: |
          if git diff --quiet; then
            echo "Formula already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "lens-scan ${GITHUB_REF_NAME#v}"
          git push
