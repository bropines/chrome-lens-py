name: Release

# One pipeline, from a pull request to a published release.
#
#   every push / PR   lint, test matrix (3.9-3.14 on Linux, one each on
#                     Windows and macOS), build the wheel + sdist, build the
#                     Docker image and probe it.
#   tag v*            all of that, then binaries for six platforms, then:
#                       draft GitHub release -> PyPI -> publish the release
#                       -> Docker image, Homebrew tap, Scoop bucket.
#   workflow_dispatch binaries are built and kept as artifacts for 7 days; no
#                     release, no publishing.
#   PR labelled       `build-binaries` builds the binaries for that PR too.
#
# Binaries are never built on a plain push to main.
#
# The release stays a DRAFT until PyPI has accepted the upload, so a failed
# publish leaves nothing public that points at a version PyPI does not have.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a tag run half way through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Compiled binaries are built with this Python regardless of the test matrix.
  BUILD_PYTHON: '3.12'
  NUITKA_VERSION: '4.2.2'

jobs:
  # ---------------------------------------------------------------- checks --

  verify:
    name: Tag matches __version__
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with src/chrome_lens_py/__about__.py
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' src/chrome_lens_py/__about__.py)
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__ from src/chrome_lens_py/__about__.py"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match __version__ $version. Fix the version (or the tag) and push again."
            exit 1
          fi
          echo "Tag $TAG matches __version__ $version"

  lint:
    name: Lint
    if: github.event.action != 'labeled' || github.event.label.name == 'build-binaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: flake8
        run: flake8 src

      - name: black
        run: black --check src

      - name: isort
        run: isort --check-only src

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event.action != 'labeled' || github.event.label.name == 'build-binaries'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.14' }
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,clipboard]"

      # The offline suite is the gate.
      - name: Offline tests
        run: python -m pytest -m "not network" -q

      # The live-API tests are informative only: they depend on Google
      # answering a runner, which is not this repo's bug.
      - name: Live API tests (informative)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        continue-on-error: true
        run: python -m pytest -m network -q

  build-dist:
    name: Build wheel and sdist
    needs: verify
    if: github.event.action != 'labeled' || github.event.label.name == 'build-binaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  docker-check:
    name: Docker image builds and answers /health
    needs: build-dist
    if: github.event.action != 'labeled' || github.event.label.name == 'build-binaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' src/chrome_lens_py/__about__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (amd64, from the wheel just built)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: lens-scan:ci
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: It refuses to start without a token
        run: |
          if docker run --rm lens-scan:ci; then
            echo "::error::the container started without LENS_TOKEN"
            exit 1
          fi

      - name: It serves /health
        run: |
          set -euo pipefail
          docker run -d --name lens -e LENS_TOKEN=ci-token -p 127.0.0.1:8765:8765 lens-scan:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then echo; break; fi
            sleep 1
            if [ "$i" = 30 ]; then docker logs lens; exit 1; fi
          done
          # Without the token the API is closed.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8765/v1/ocr -d '{}')
          [ "$code" = 401 ] || { echo "::error::expected 401 without a token, got $code"; exit 1; }
          docker rm -f lens

  # -------------------------------------------------------------- binaries --

  build-nuitka:
    name: Nuitka (${{ matrix.asset }})
    needs: [verify, lint, test]
    # Tags and manual runs always; pull requests only when asked to.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-binaries'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   asset: lens_scan-windows-amd64,  binary: lens_scan.exe }
          # Linux binaries link against the glibc of the machine that builds
          # them, so build on the oldest image there is: the result then runs
          # anywhere newer. The max GLIBC symbol is printed in the smoke test.
          - { os: ubuntu-22.04,     asset: lens_scan-linux-amd64,    binary: lens_scan.bin }
          - { os: ubuntu-22.04-arm, asset: lens_scan-linux-arm64,    binary: lens_scan.bin }
          - { os: macos-latest,     asset: lens_scan-macos-arm64,    binary: lens_scan.bin }
          - { os: macos-15-intel,   asset: lens_scan-macos-x86_64,   binary: lens_scan.bin }
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      ASSET: ${{ matrix.asset }}
      BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BUILD_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf ccache

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      # Downloaded helper tools (ccache and the like on Windows) and the
      # compiler cache. A miss costs build time, never correctness.
      - name: Cache Nuitka
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nuitka-cache
          key: nuitka-${{ matrix.asset }}-${{ env.NUITKA_VERSION }}-${{ hashFiles('src/**/*.py', 'lens_scan.py', 'pyproject.toml') }}
          restore-keys: |
            nuitka-${{ matrix.asset }}-${{ env.NUITKA_VERSION }}-

      # With the clipboard extra: --sharex is how ShareX gets its result back,
      # and a plain `pip install .` left pyperclip out of every binary we
      # shipped for a long time, so --sharex silently copied nothing.
      - name: Install package and Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install ".[clipboard]" "nuitka==${{ env.NUITKA_VERSION }}"

      # Choices worth knowing about:
      #
      # lens_scan.py, not src/chrome_lens_py/cli/main.py: building a module
      # file directly leaves its relative imports without a package, and every
      # binary died on startup with "attempted relative import with no known
      # parent package".
      #
      # standalone, not onefile: onefile unpacks an executable payload into
      # %TEMP% on every launch. That is what antivirus heuristics flag, and it
      # costs 1.67 s of startup against 0.52 s from source. A folder does
      # neither.
      #
      # pyperclip named explicitly: it is imported inside a function, in a
      # try/except, which is the shape a bundler is most likely to miss.
      - name: Build with Nuitka
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' src/chrome_lens_py/__about__.py)
          flags=(
            --standalone
            --include-package=chrome_lens_py
            --include-package=pyperclip
            --assume-yes-for-downloads
            --remove-output
            --output-dir=dist
          )
          if [ "$RUNNER_OS" = Windows ]; then
            # Version resource: an .exe with a company and a description looks
            # less like malware to heuristics than one with none.
            flags+=(
              --company-name=bropines
              --product-name=lens_scan
              "--file-description=Google Lens OCR and translation command-line client"
              "--file-version=${version%%[-+]*}"
              "--product-version=${version%%[-+]*}"
            )
          fi
          python -m nuitka "${flags[@]}" lens_scan.py

      # Optional Authenticode signing through SignPath Foundation (free for open
      # source). Inert until the repository variable SIGNPATH_ORGANIZATION_ID
      # and the secret SIGNPATH_API_TOKEN exist. Optional variables:
      # SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG.
      - name: Upload the unsigned Windows build for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.asset }}
          path: dist/lens_scan.dist
          retention-days: 1

      - name: Sign with SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'chrome-lens-py' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed files
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/lens_scan.dist
          mv signed dist/lens_scan.dist
          ls dist/lens_scan.dist | head

      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          exe="./dist/lens_scan.dist/${BINARY}"
          chmod +x "$exe" || true
          "$exe" --help > /dev/null
          echo "binary starts and prints help"

          # Every binary up to 3.5.2 shipped without pyperclip, so --sharex
          # copied nothing and said nothing - which is precisely how ShareX
          # hands the result back. Fail the build rather than ship that again.
          "$exe" --version | tee "$RUNNER_TEMP/version.txt"
          grep -q "Clipboard.*available" "$RUNNER_TEMP/version.txt" || {
            echo "::error::pyperclip is missing from the build; --sharex would do nothing."
            exit 1
          }
          echo "clipboard support is bundled"

      # The newest glibc symbol anything in the folder needs is the oldest
      # distribution it will run on. Recorded so a runner image bump that
      # silently raises it shows up in the log and the job summary.
      - name: Record the glibc requirement
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          max=$(find dist/lens_scan.dist -type f \( -name '*.so' -o -name '*.so.*' -o -name "$BINARY" \) -print0 \
            | xargs -0 objdump -T 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          ldd --version | head -1
          echo "Max GLIBC symbol version required: ${max:-none}"
          echo "### ${ASSET}: needs ${max:-no} glibc (built on $(. /etc/os-release; echo "$PRETTY_NAME"))" >> "$GITHUB_STEP_SUMMARY"

      - name: Package the folder
        shell: bash
        run: |
          set -euo pipefail
          mv dist/lens_scan.dist "dist/${ASSET}"
          # Zip and checksum (sha256sum's own format, so
          # `sha256sum -c lens_scan-linux-amd64.zip.sha256` verifies by hand).
          python scripts/make_zip.py "dist/${ASSET}"
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.zip
            dist/${{ matrix.asset }}.zip.sha256
          retention-days: 7
          if-no-files-found: error

  build-portable:
    name: Portable Windows build (signed Python, no compiled executable of ours)
    needs: [verify, lint, test]
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-binaries'))
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ASSET: lens_scan-windows-amd64-portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BUILD_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The script downloads the pinned embeddable Python (hash-checked),
      # installs the package into Lib\site-packages, removes every launcher
      # .exe, precompiles, then asserts that python.exe, pythonw.exe and all
      # DLLs beside them carry a valid Authenticode signature, that no other
      # .exe exists, and that `lens_scan.cmd --version` reports clipboard
      # support.
      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip uv
          python scripts/build_portable.py --out dist

      - name: Package the folder
        shell: bash
        run: python scripts/make_zip.py "dist/${ASSET}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ env.ASSET }}
          path: |
            dist/${{ env.ASSET }}.zip
            dist/${{ env.ASSET }}.zip.sha256
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------- publish --

  release:
    name: Draft the GitHub release
    needs: [verify, lint, test, build-dist, docker-check, build-nuitka, build-portable]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and attach assets
      id-token: write      # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # git-cliff needs the history between tags
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-lens_scan-*
          merge-multiple: true
          path: dist

      # Everything the installers, Homebrew, Scoop and the docs promise must be
      # here. A platform that failed to build fails the release; it does not
      # quietly ship without it.
      - name: Check that every asset is present
        run: |
          set -euo pipefail
          ls -la dist
          missing=0
          for p in windows-amd64 windows-amd64-portable linux-amd64 linux-arm64 macos-arm64 macos-x86_64; do
            for f in "lens_scan-$p.zip" "lens_scan-$p.zip.sha256"; do
              [ -s "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
            (cd dist && sha256sum -c "lens_scan-$p.zip.sha256")
          done
          exit $missing

      - name: Release notes
        run: |
          set -euo pipefail
          # The hand-written CHANGELOG section for this version reads far better
          # than a list of commit subjects, so prefer it; git-cliff is the
          # fallback for a release nobody wrote notes for.
          version="${TAG#v}"
          # Plain string comparison, not regex: awk implementations disagree on
          # escaping brackets inside a dynamic regex.
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on && index($0, "[") == 1 && index($0, "]: http") > 0 { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ] && grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "Using the CHANGELOG.md section for $version"
          else
            python -m pip install "git-cliff==2.14.2"
            git-cliff --latest --strip header --output RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${TAG}" > RELEASE_NOTES.md
          fi
          sed "s/@VERSION@/${TAG#v}/g" .github/release-footer.md >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Create the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256

  publish-pypi:
    name: Publish to PyPI
    needs: [build-dist, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chrome_lens_py
    permissions:
      id-token: write      # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A re-run after a later step failed must not die on "file exists".
          skip-existing: true

  publish-release:
    name: Publish the GitHub release
    needs: [release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Un-draft
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  docker:
    name: Publish the Docker image
    needs: [build-dist, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The very wheel that went to PyPI, not a rebuild from PyPI that might
      # not have propagated yet.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}

  bump-homebrew-tap:
    name: Bump the Homebrew tap
    needs: publish-release
    permissions:
      contents: read
    # The bump lives in its own reusable workflow so it can also be run by
    # hand. Called here rather than duplicated.
    uses: ./.github/workflows/bump-tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  bump-scoop:
    name: Bump the Scoop bucket
    needs: publish-release
    runs-on: ubuntu-latest
    # The bucket is in this repository (bucket/), so this is a commit to main.
    # If branch protection rejects it the release is still fine; run
    # `python scripts/bump_scoop_manifest.py <tag>` by hand.
    continue-on-error: true
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Rewrite the manifests
        run: python3 scripts/bump_scoop_manifest.py "$TAG"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Manifests already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(scoop): lens-scan ${TAG#v} [skip ci]"
          git push origin HEAD:main
