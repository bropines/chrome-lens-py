name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install protobuf

      - name: Lint with flake8
        run: flake8 src

      - name: Check formatting with black
        run: black --check src

      - name: Sort imports check (isort)
        run: isort --check-only src

      - name: Run tests
        run: pytest tests/test_api.py

  build:
    name: Build for ${{ matrix.os }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Only build on main branch or tags, or manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: lens_scan-windows-amd64.exe
            output_file: main.exe
          - os: ubuntu-latest
            asset_name: lens_scan-linux-amd64
            output_file: main.bin
          - os: macos-latest
            asset_name: lens_scan-macos-arm64
            output_file: main.bin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@v1.1
        with:
          script-name: src/chrome_lens_py/cli/main.py
          onefile: true
          output-dir: dist
          output-file: ${{ matrix.output_file }}
          assume-yes-for-downloads: true

      - name: Rename artifact
        shell: bash
        run: mv dist/${{ matrix.output_file }} dist/${{ matrix.asset_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2.3.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as GitHub Artifact (for manual runs)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

