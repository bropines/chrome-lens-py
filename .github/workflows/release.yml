name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install protobuf

      - name: Lint with flake8
        run: flake8 src

      - name: Check formatting with black
        run: black --check src

      - name: Sort imports check (isort)
        run: isort --check-only src

      # The offline suite is the gate. The live-API tests are informative only:
      # they depend on Google answering a runner, which is not this repo's bug.
      - name: Run tests
        run: pytest -m "not network"

      - name: Run live API tests
        continue-on-error: true
        run: pytest -m network

  build:
    name: Build for ${{ matrix.os }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Only build on main branch or tags, or manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: lens_scan-windows-amd64
            binary: lens_scan.exe
          - os: ubuntu-latest
            asset_name: lens_scan-linux-amd64
            binary: lens_scan.bin
          - os: macos-latest
            asset_name: lens_scan-macos-arm64
            binary: lens_scan.bin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # With the clipboard extra: --sharex is how ShareX gets its result back,
      # and a plain `pip install .` left pyperclip out of every binary we have
      # ever shipped, so --sharex silently copied nothing. Caught on macOS.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[clipboard]"

      # Two deliberate choices here.
      #
      # lens_scan.py, not src/chrome_lens_py/cli/main.py: building a module file
      # directly leaves its relative imports without a package to resolve
      # against, and every binary died on startup with "attempted relative
      # import with no known parent package".
      #
      # standalone, not onefile: onefile unpacks an executable payload into
      # %TEMP% and runs it on every launch. That is what antivirus heuristics
      # flag (Defender reports Trojan:Win32/Wacatac.H!ml, an ML verdict rather
      # than a signature), and it also cost 1.67 s of startup against 0.52 s
      # from source. A folder does neither.
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@v1.1
        with:
          script-name: lens_scan.py
          standalone: true
          onefile: false
          output-dir: dist
          # pyperclip named explicitly: it is imported inside a function, in a
          # try/except, which is exactly the shape a bundler is most likely to
          # miss.
          include-package: |
            chrome_lens_py
            pyperclip
          assume-yes-for-downloads: true

      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/lens_scan.dist/${{ matrix.binary }} || true
          ./dist/lens_scan.dist/${{ matrix.binary }} --help > /dev/null
          echo "binary starts and prints help"

          # Every binary up to 3.5.2 shipped without pyperclip, so --sharex
          # copied nothing and said nothing - which is precisely how ShareX
          # hands the result back. Fail the build rather than ship that again.
          ./dist/lens_scan.dist/${{ matrix.binary }} --version | tee /tmp/version.txt
          grep -q "Clipboard.*available" /tmp/version.txt || {
            echo "::error::pyperclip is missing from the build; --sharex would do nothing."
            exit 1
          }
          echo "clipboard support is bundled"

      - name: Package the folder
        shell: bash
        run: |
          mv dist/lens_scan.dist dist/${{ matrix.asset_name }}
          cd dist && 7z a -tzip ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }} > /dev/null
          ls -la ${{ matrix.asset_name }}.zip

      # Published next to the zip so the installers can tell a good download
      # from a truncated or tampered one. sha256sum's own format, so
      # `sha256sum -c lens_scan-linux-amd64.zip.sha256` verifies it by hand.
      - name: Checksum the archive
        shell: bash
        working-directory: dist
        run: |
          if command -v sha256sum > /dev/null; then
            sha256sum ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.zip.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.zip.sha256
          fi
          cat ${{ matrix.asset_name }}.zip.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2.3.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ matrix.asset_name }}.zip
            dist/${{ matrix.asset_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as GitHub Artifact (for manual runs)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}.zip
            dist/${{ matrix.asset_name }}.zip.sha256


  # The formula bump lives in its own reusable workflow so it can also be run
  # by hand. Called here rather than duplicated.
  bump-homebrew-tap:
    name: Bump the Homebrew tap
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/bump-tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
