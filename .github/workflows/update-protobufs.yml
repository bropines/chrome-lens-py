name: Update Protobufs

# Weekly: regenerate the protobuf modules from Chromium, run the offline suite
# against them, and open a pull request. Nothing is pushed to main.
#
# Needs (repository settings): Actions > General > "Allow GitHub Actions to
# create and approve pull requests". Pull requests created with GITHUB_TOKEN do
# not trigger other workflows, which is why the tests run here, before the PR
# exists, rather than relying on the PR's own checks.

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-protobufs
  cancel-in-progress: false

jobs:
  update-protos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/requirements-protos.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-protos.txt
          pip install ".[dev,clipboard]"

      # Exits non-zero if any proto fails to compile, an import cannot be
      # resolved, or a bare `import x_pb2` is left behind. It also runs
      # scripts/fix_proto_imports.py and formats the output.
      - name: Regenerate
        id: regen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/update_protos.py | tee "$RUNNER_TEMP/regen.log"
          commit=$(sed -n 's/^Chromium main = //p' "$RUNNER_TEMP/regen.log")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Did anything change?
        id: diff
        run: |
          if git diff --quiet -- src/chrome_lens_py/utils/protobufs \
             && [ -z "$(git ls-files --others --exclude-standard src/chrome_lens_py/utils/protobufs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protobufs are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short src/chrome_lens_py/utils/protobufs
          fi

      # A regeneration that does not pass the suite must not become a PR that
      # looks mergeable.
      - name: Offline tests
        if: steps.diff.outputs.changed == 'true'
        run: python -m pytest -m "not network" -q

      - name: Live API tests (informative)
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: python -m pytest -m network -q

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: auto-update-protos
          delete-branch: true
          add-paths: src/chrome_lens_py/utils/protobufs/
          commit-message: 'chore: auto-update protobufs from chromium'
          title: 'chore: auto-update protobufs from chromium'
          body: |
            Regenerated by `scripts/update_protos.py` from
            [chromium/chromium@${{ steps.regen.outputs.commit }}](https://github.com/chromium/chromium/tree/${{ steps.regen.outputs.commit }}/third_party/lens_server_proto).

            Compiled with the protoc bundled in the pinned `grpcio-tools`
            (`scripts/requirements-protos.txt`), imports rewritten to relative
            form, and the offline test suite passed on this exact tree before
            the PR was opened.

            If the generated files report a newer protobuf version than
            `protobuf >= ...` in `pyproject.toml`, `tests/test_protos.py` fails:
            raise the lower bound in the same PR.
